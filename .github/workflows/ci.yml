publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./taskflow-backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/taskflow-backend:latest
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./taskflow-frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/taskflow-frontend:latest