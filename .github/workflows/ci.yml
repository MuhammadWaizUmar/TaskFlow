name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taskflow-backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: node --check src/server.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taskflow-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t taskflow-backend ./taskflow-backend
      - name: Build frontend image
        run: docker build -t taskflow-frontend ./taskflow-frontend

  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./taskflow-backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/taskflow-backend:latest
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./taskflow-frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/taskflow-frontend:latest